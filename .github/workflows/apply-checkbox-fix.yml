name: Apply 0.1.07 checkbox fix

on:
  push:
    branches:
      - 0.1.07

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[build-zip]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply release patch
        run: |
          set -euo pipefail
          test -f release.patch.gz.b64
          base64 -d release.patch.gz.b64 | gzip -dc > release.patch
          git apply --check release.patch
          git apply release.patch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build plugin archive
        run: python build_plugin.py

      - name: Verify plugin archive
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          with ZipFile("tolino_cloud_sync.zip") as archive:
              assert len(archive.namelist()) == 32
              assert archive.testzip() is None
          PY

      - name: Commit release
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f release.patch release.patch.gz.b64 .github/workflows/apply-checkbox-fix.yml
          git add -A
          git commit -m "Update 0.1.07 release archive"
          git push origin HEAD:0.1.07

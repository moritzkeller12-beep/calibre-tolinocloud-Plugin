name: Build plugin archive

on:
  push:
    branches:
      - "0.1.07"

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message == 'Update changelog for 0.1.07'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and commit archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "moritzkeller12-beep"
          git config user.email "329108308+moritzkeller12-beep@users.noreply.github.com"
          python3 build_plugin.py
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile("tolino_cloud_sync.zip") as archive:
              assert len(archive.namelist()) == 32
              assert archive.testzip() is None
          PY
          git add tolino_cloud_sync.zip
          git rm -q .github/workflows/build-zip.yml
          git commit -m "Update plugin archive for 0.1.07

          Baut das versionierte ZIP aus dem aktuellen Quellstand neu.

          🤖 Generated with Codebuff
          Co-Authored-By: Codebuff <noreply@codebuff.com>"
          git push

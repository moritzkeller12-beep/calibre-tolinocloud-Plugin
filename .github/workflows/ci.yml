name: tests

on:
  push:
    branches: [main, "0.1.*"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libfontconfig1 libfreetype6 libxkbcommon0

      - name: Install test-only dependencies
        run: python3 -m pip install --quiet pycryptodome pyflakes PyQt6

      - name: Unit tests
        env:
          # Offene Sockets und Threads früh sichtbar machen.
          PYTHONWARNINGS: error::ResourceWarning
        # Ab 3.12 nennt --durations die langsamsten Tests im Log.
        run: |
          if python3 -m unittest --help 2>&1 | grep -q -- --durations; then
            python3 -m unittest --durations 10 calibre_plugin.test_sync
          else
            python3 -m unittest calibre_plugin.test_sync
          fi

      - name: Lint (unused imports, undefined names)
        run: python3 -m pyflakes calibre_plugin/ __init__.py build_plugin.py

      - name: Build plugin zip
        run: python3 build_plugin.py

      - uses: actions/upload-artifact@v4
        with:
          name: tolino_cloud_sync-${{ matrix.python-version }}
          path: tolino_cloud_sync.zip

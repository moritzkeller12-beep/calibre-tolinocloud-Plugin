name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test-only dependency
        run: python3 -m pip install --quiet pycryptodome

      - name: Unit tests
        run: python3 -m unittest calibre_plugin.test_sync

      - name: Build plugin zip
        run: python3 build_plugin.py

      - uses: actions/upload-artifact@v4
        with:
          name: tolino_cloud_sync
          path: tolino_cloud_sync.zip

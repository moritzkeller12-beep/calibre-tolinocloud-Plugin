name: rebuild-release-zip

on:
  push:
    branches: ["0.1.07"]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and commit release ZIP
        run: |
          python3 build_plugin.py
          if git diff --quiet -- tolino_cloud_sync.zip; then
            echo "ZIP already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rebuild-release-zip.yml
          git add tolino_cloud_sync.zip
          git commit -m "Rebuild 0.1.07 release zip"
          git push

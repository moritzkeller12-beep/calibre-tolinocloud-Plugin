name: Apply final 0.1.07 release

on:
  push:
    branches:
      - 0.1.07
    paths:
      - .github/workflows/apply-final.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[automated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply release patch
        run: |
          set -euo pipefail
          cat .release-parts/part-00.b64 .release-parts/part-01.b64 .release-parts/part-02.b64 .release-parts/part-03.b64 | base64 -d | gzip -dc > release.patch
          git apply --check release.patch
          git apply release.patch
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Remove release helpers and build archive
        run: |
          set -euo pipefail
          rm -rf .release-parts
          rm -f release.patch .github/workflows/apply-final.yml
          python build_plugin.py
      - name: Commit and push final release
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize 0.1.07 release [automated]"
          git push origin HEAD:0.1.07

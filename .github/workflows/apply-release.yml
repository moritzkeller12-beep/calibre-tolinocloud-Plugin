name: Apply 0.1.07 release

on:
  push:
    branches:
      - 0.1.07

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[automated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply release patch
        run: |
          test -f release.patch.gz.b64
          base64 -d release.patch.gz.b64 | gzip -dc > release.patch
          git apply --check release.patch
          git apply release.patch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build plugin archive
        run: python build_plugin.py
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f release.patch release.patch.gz.b64 .github/workflows/apply-release.yml
          git add -A
          git commit -m "Apply 0.1.07 debug release [automated]"
          git push origin HEAD:0.1.07

name: Final corrected 0.1.07

on:
  push:
    branches:
      - release/0.1.07-final

permissions:
  contents: write

env:
  FIXES_B64: 

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.1.07-final
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild final release artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s' "$FIXES_B64" | base64 -d | gzip -d > /tmp/fixes.patch
          git apply /tmp/fixes.patch
          python build_plugin.py
          test "$(unzip -Z1 tolino_cloud_sync.zip | wc -l)" -eq 34
          unzip -p tolino_cloud_sync.zip ui_dialogs.py | grep -F '_ignore_release'
          unzip -p tolino_cloud_sync.zip ui_workers.py | grep -F 'entry.pop("reading"'
          unzip -p tolino_cloud_sync.zip CHANGELOG.md | grep -F 'Doppelklick'
          rm .github/workflows/release-final.yml
          git add -A
          git commit -m "Fix checkbox double-click and stale upload reading state"
          git commit --allow-empty -m "Verify final 0.1.07 fixes artifact"
          git push --force origin HEAD:refs/heads/0.1.07
